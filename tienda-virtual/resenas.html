    "@context": "https://schema.org",

        <p data-content="reviewsCtaText">Contá tu experiencia en Google. Nos ayuda a que más vecinos nos encuentren.</p>
        <a class="button button-primary" data-google-review href="#" target="_blank" rel="noopener noreferrer"><span data-content="reviewsCta">Dejar mi reseña en Google</span></a>

    </section>
